<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mirza Patrolium PSO</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--tx:#14213d;--mut:#6b7385;--red:#d62828;--navy:#0b1d3a;--bd:#e1e5ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1524;--card:#17213a;--tx:#e8ecf4;--mut:#9aa5bd;--bd:#2a3654;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}
#app{display:flex;min-height:100vh}nav{width:200px;background:var(--navy);color:#fff;padding:14px 8px;flex-shrink:0}nav h2{font-size:15px;margin:4px 8px 14px}nav h2 span{color:#ff6b6b}
nav a{display:block;padding:10px 12px;border-radius:8px;color:#cdd6ea;cursor:pointer;font-size:14px}nav a.on,nav a:hover{background:var(--red);color:#fff}
main{flex:1;padding:16px;min-width:0}h1{font-size:20px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}.k{font-size:12px;color:var(--mut)}.v{font-size:19px;font-weight:700;margin-top:4px}
button{background:var(--red);color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:13px}button.g{background:var(--navy)}button.s{padding:4px 8px;font-size:12px}
input,select,textarea{padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font-size:14px;width:100%}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end;margin-bottom:12px}label{font-size:12px;color:var(--mut);display:block}
.t{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.bar{height:8px;background:var(--bd);border-radius:5px}.bar i{display:block;height:100%;background:var(--red);border-radius:5px}.warn{color:var(--red);font-weight:600}
#login{max-width:340px;margin:12vh auto;padding:16px}#toast{position:fixed;bottom:16px;right:16px;background:var(--navy);color:#fff;padding:10px 14px;border-radius:8px;display:none}
@media(max-width:700px){#app{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;padding:6px}nav h2{display:none}nav a{white-space:nowrap}}
@media print{nav,.np,#toast{display:none!important}body{background:#fff;color:#000}main{padding:0}}:root[data-theme=dark]{--bg:#0e1524;--card:#17213a;--tx:#e8ecf4;--mut:#9aa5bd;--bd:#2a3654;color-scheme:dark}#rc{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:9}#rc .p{background:#fff;color:#000;padding:16px;width:310px;max-height:90vh;overflow:auto}@media print{body.rp #root{display:none}body.rp #rc{position:static;background:none}body.rp #rc .b{display:none}}
</style></head><body><div id="root"></div><div id="toast"></div>
<script>
const R=document.getElementById('root'),$=s=>document.querySelector(s);
const fm=n=>'Rs '+(+n||0).toLocaleString('en-PK',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Karachi'});
const nowS=()=>new Date().toLocaleString('en-GB',{timeZone:'Asia/Karachi'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=null,page='dash',cust=null,session=false;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
// IndexedDB store
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('mirza',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function load(){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get('state');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
async function save(){try{const d=await idb();d.transaction('kv','readwrite').objectStore('kv').put(JSON.parse(JSON.stringify(S)),'state')}catch(e){toast('Save failed')}}
const uid=p=>p+'-'+Date.now().toString(36).toUpperCase()+Math.floor(Math.random()*99);
function log(a){S.audit.unshift({t:nowS(),a});S.audit=S.audit.slice(0,300)}
async function hash(p,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:150000,hash:'SHA-256'},k,256);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const bal=id=>S.ledger.filter(l=>l.cid===id).reduce((s,l)=>s+(l.type==='payment'||l.type==='adj'?-l.amt:l.amt),0);
const stockOf=f=>S.tanks.filter(t=>t.fuel===f).reduce((s,t)=>s+t.stock,0);
function init(){S={owner:null,biz:{name:'Mirza Patrolium PSO',owner:'Muhammad Abbas',phone:'03177265790',loc:'Awan Chowk'},prices:{Petrol:0,HSD:0},customers:[],ledger:[],sales:[],tanks:[],moves:[],expenses:[],audit:[],openCash:0}}
async function boot(){S=await load();if(!S)init();S.suppliers=S.suppliers||[];S.spay=S.spay||[];S.closings=S.closings||[];S.phist=S.phist||[];S.staff=S.staff||[];S.att=S.att||[];try{const t=localStorage.getItem('th');if(t)document.documentElement.dataset.theme=t}catch(e){}render();['click','keydown','touchstart'].forEach(e=>addEventListener(e,()=>idle=Date.now()));setInterval(()=>{if(session&&Date.now()-idle>6e5){session=false;toast('Auto logout after 10 min idle');render()}},15000)}
function loginView(){const first=!S.owner;R.innerHTML=`<div id="login" class="c"><h1><span style="color:var(--red)">●</span> Mirza Patrolium PSO</h1><p class="k">${first?'First-time setup: create the owner password (min 8 characters). It is stored only as a salted hash.':'Owner login'}</p><label>Password</label><input id="pw" type="password" autocomplete="${first?'new-password':'current-password'}"><label style="margin-top:6px"><input type="checkbox" onchange="pw.type=this.checked?'text':'password'" style="width:auto"> Show password</label><br><button onclick="doLogin()">${first?'Create & enter':'Login'}</button><p class="k">Phase 1 stores data in this browser (IndexedDB). Use Backup regularly. Multi-device sync needs the backend phase.</p></div>`}
async function doLogin(){const p=$('#pw').value;if(!S.owner){if(p.length<8)return toast('Use 8+ characters');const salt=uid('S');S.owner={salt,h:await hash(p,salt)};log('Owner account created');await save()}else if(await hash(p,S.owner.salt)!==S.owner.h){log('Failed login');await save();return toast('Wrong password')}else log('Login');session=true;await save();render()}
const pages=[['dash','Dashboard'],['sales','Fuel Sales'],['cust','Udhaar / Customers'],['stock','Stock & Tanks'],['sup','Suppliers'],['staff','Staff'],['exp','Expenses'],['rep','Reports & P&L'],['cash','Cash Register'],['set','Settings & Backup']];
function render(){if(!session)return loginView();R.innerHTML=`<div id="app"><nav class="np"><h2><span>●</span> ${esc(S.biz.name)}</h2>${pages.map(p=>`<a class="${page===p[0]?'on':''}" onclick="go('${p[0]}')">${p[1]}</a>`).join('')}<a onclick="theme()">Light / Dark</a><a onclick="session=false;render()">Logout</a></nav><main id="m"></main></div>`;V[page]()}
function go(p){page=p;cust=null;render()}
const tbl=(h,rows)=>`<div class="t"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.length?rows.join(''):`<tr><td colspan="${h.length}" class="k">No records yet.</td></tr>`}</table></div>`;
const fld=(l,h)=>`<div><label>${l}</label>${h}</div>`;
const todayStats=()=>{const d=today(),s=S.sales.filter(x=>x.date===d&&!x.rev);const rev=s.reduce((a,x)=>a+x.amt,0),cash=s.filter(x=>x.method!=='credit').reduce((a,x)=>a+x.amt,0),cr=s.filter(x=>x.method==='credit').reduce((a,x)=>a+x.amt,0),ex=S.expenses.filter(x=>x.date===d).reduce((a,x)=>a+x.amt,0);return{rev,cash,cr,ex,l:s.reduce((a,x)=>a+x.l,0),gp:s.reduce((a,x)=>a+x.amt-(x.cogs||0),0)}}
function cashCalc(d){const cs=S.sales.filter(x=>x.date===d&&x.method==='cash'&&!x.rev).reduce((a,x)=>a+x.amt,0);const rc=S.ledger.filter(x=>x.date===d&&x.type==='payment'&&x.method==='cash').reduce((a,x)=>a+x.amt,0);const ex=S.expenses.filter(x=>x.date===d&&x.method==='cash').reduce((a,x)=>a+x.amt,0);const sp=S.moves.filter(x=>x.date===d&&x.type==='purchase'&&x.paid).reduce((a,x)=>a+x.paid,0)+S.spay.filter(x=>x.date===d&&x.method==='cash').reduce((a,x)=>a+x.amt,0);return{cs,rc,ex,sp,exp:openFor(d)+cs+rc-ex-sp}}
const V={
dash(){const t=todayStats(),c=cashCalc(today()),owed=S.customers.reduce((a,x)=>a+bal(x.id),0);
const low=S.tanks.filter(x=>x.stock<=x.min),over=S.customers.filter(x=>x.limit>0&&bal(x.id)>x.limit);
$('#m').innerHTML=`<h1>Dashboard <span class="k">${nowS()}</span></h1><div class="grid">${[['Today’s Sales',t.rev],['Cash Sales',t.cash],['Credit Sales',t.cr],['Expenses',t.ex],['Expected Cash',c.exp],['Est. Gross Profit',t.gp],['Total Udhaar',owed]].map(x=>`<div class="c"><div class="k">${x[0]}</div><div class="v">${fm(x[1])}</div></div>`).join('')}<div class="c"><div class="k">Litres Sold Today</div><div class="v">${t.l.toFixed(2)} L</div></div><div class="c"><div class="k">Fuel Stock</div><div class="v">${S.tanks.reduce((a,x)=>a+x.stock,0).toFixed(0)} L</div></div></div>
<div class="c"><b>Alerts</b>${low.map(x=>`<p class="warn">Low stock: ${esc(x.name)} (${x.stock} L)</p>`).join('')}${over.map(x=>`<p class="warn">${esc(x.name)} exceeds credit limit (${fm(bal(x.id))})</p>`).join('')}${low.length+over.length?'':'<p class="k">No alerts.</p>'}</div>
<div class="c"><b>Last 7 days sales</b>${bars(7)}</div><p class="k">Gross profit = revenue minus cost of fuel sold (weighted average). Revenue is not profit; final accounting profit may differ.</p>`},
sales(){const f=Object.keys(S.prices);$('#m').innerHTML=`<h1>Fuel Sales</h1><form onsubmit="addSale(event)">${fld('Fuel',`<select name="fuel" onchange="this.form.price.value=S.prices[this.value]||''">${f.map(x=>`<option>${x}</option>`).join('')}</select>`)}${fld('Litres','<input name="l" type="number" step="0.01" min="0.01" required oninput="tot(this.form)">')}${fld('Price / litre',`<input name="price" type="number" step="0.01" min="0.01" value="${S.prices[f[0]]||''}" required oninput="tot(this.form)">`)}${fld('Total','<input name="tot" readonly>')}${fld('Payment','<select name="method"><option value="cash">Cash</option><option value="bank">Bank transfer</option><option value="credit">Udhaar (credit)</option></select>')}${fld('Customer (for udhaar)',`<select name="cid"><option value="">—</option>${S.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>`)}${fld('Staff','<select name="staff"><option value="">—</option>'+S.staff.filter(s=>s.active!==false).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')+'</select>')}${fld('Notes','<input name="note">')}<button>Record sale</button></form>
${tbl(['ID','Date','Fuel','L','Rate','Total','Method','Customer',''],S.sales.slice().reverse().slice(0,50).map(x=>`<tr><td>${x.id}</td><td>${x.date}</td><td>${x.fuel}</td><td>${x.l}</td><td>${x.price}</td><td>${fm(x.amt)}</td><td>${x.method}${x.rev?' (REVERSED)':''}</td><td>${esc(S.customers.find(c=>c.id===x.cid)?.name||'')}</td><td><button class="s g" onclick="rcpt('${x.id}')">Receipt</button> ${x.rev?'':`<button class="s" onclick="revSale('${x.id}')">Reverse</button>`}</td></tr>`))}`},
cust(){if(cust)return V.led();$('#m').innerHTML=`<h1>Udhaar / Customers</h1><form onsubmit="addCust(event)">${fld('Name','<input name="name" required>')}${fld('Phone (92…)','<input name="phone">')}${fld('Vehicle','<input name="veh">')}${fld('Opening balance','<input name="open" type="number" step="0.01" value="0">')}${fld('Credit limit (0 = none)','<input name="limit" type="number" value="0">')}<button>+ Add customer</button></form><input placeholder="Search name, phone, ID, vehicle" oninput="q=this.value.toLowerCase();$('#ct').innerHTML=ctRows()"><div id="ct"></div>`;$('#ct').innerHTML=ctRows()}
,led(){const c=S.customers.find(x=>x.id===cust),L=S.ledger.filter(l=>l.cid===c.id);let run=0;
$('#m').innerHTML=`<h1>${esc(c.name)} <span class="k">${c.id}</span></h1><div class="grid np"><div class="c"><div class="k">Outstanding</div><div class="v ${c.limit&&bal(c.id)>c.limit?'warn':''}">${fm(bal(c.id))}</div></div><div class="c"><div class="k">Credit limit</div><div class="v">${c.limit?fm(c.limit):'None'}</div></div></div>
<form class="np" onsubmit="addLed(event)">${fld('Type','<select name="type"><option value="credit">+ Add udhaar</option><option value="payment">+ Receive payment</option></select>')}${fld('Amount','<input name="amt" type="number" step="0.01" min="0.01" required>')}${fld('Method','<select name="method"><option value="cash">Cash</option><option value="bank">Bank</option></select>')}${fld('Note','<input name="note">')}<button>Save</button></form>
<p class="np"><button class="g" onclick="print()">Print statement</button> <button onclick="wa('${c.id}')">WhatsApp reminder</button> <button class="g" onclick="cust=null;render()">Back</button></p>
<p>${esc(S.biz.name)} — Statement as of ${nowS()}</p>${tbl(['Date','Type','Note','Debit','Credit','Balance'],L.map(l=>{const d=l.type==='payment'||l.type==='adj';run+=d?-l.amt:l.amt;return`<tr><td>${l.date}</td><td>${l.type}</td><td>${esc(l.note||'')}</td><td>${d?'':fm(l.amt)}</td><td>${d?fm(l.amt):''}</td><td>${fm(run)}</td></tr>`}))}`}};
let q='';
function ctRows(){const r=S.customers.filter(c=>[c.name,c.phone,c.id,c.veh].join(' ').toLowerCase().includes(q));return tbl(['ID','Name','Phone','Vehicle','Balance',''],r.map(c=>`<tr><td>${c.id}</td><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(c.veh)}</td><td class="${c.limit&&bal(c.id)>c.limit?'warn':''}">${fm(bal(c.id))}</td><td><button class="s" onclick="cust='${c.id}';render()">View account</button></td></tr>`))}
function tot(f){f.tot.value=fm((+f.l.value||0)*(+f.price.value||0))}
async function addCust(e){e.preventDefault();const f=e.target,c={id:uid('C'),name:f.name.value.trim(),phone:f.phone.value.replace(/\D/g,''),veh:f.veh.value,limit:+f.limit.value||0,created:today()};S.customers.push(c);const o=+f.open.value||0;if(o)S.ledger.push({id:uid('L'),cid:c.id,type:'credit',amt:o,date:today(),note:'Opening balance'});log('Customer added '+c.id);await save();toast('Customer saved');render()}
async function addLed(e){e.preventDefault();const f=e.target,a=+f.amt.value,t=f.type.value;if(!(a>0))return;if(t==='payment'&&a>bal(cust)&&!confirm('Payment exceeds balance. Continue?'))return;const c=S.customers.find(x=>x.id===cust);if(t==='credit'&&c.limit&&bal(cust)+a>c.limit&&!confirm('This exceeds the credit limit. Continue?'))return;S.ledger.push({id:uid('L'),cid:cust,type:t,amt:a,method:f.method.value,date:today(),note:f.note.value});log(t+' '+fm(a)+' '+cust);await save();toast('Saved');render()}
async function addSale(e){e.preventDefault();const f=e.target,l=+f.l.value,p=+f.price.value,m=f.method.value,cid=f.cid.value;if(!(l>0&&p>0))return;if(m==='credit'&&!cid)return toast('Choose a customer for udhaar');const amt=Math.round(l*p*100)/100,fuel=f.fuel.value;
if(stockOf(fuel)<l){if(S.tanks.some(t=>t.fuel===fuel)){return toast('Not enough '+fuel+' stock')}}
const dup=S.sales.find(x=>x.fuel===fuel&&x.l===l&&x.amt===amt&&Date.now()-x.ts<60000);if(dup&&!confirm('Similar sale recorded within a minute. Save anyway?'))return;
if(m==='credit'){const c=S.customers.find(x=>x.id===cid);if(c.limit&&bal(cid)+amt>c.limit&&!confirm('Credit limit exceeded. Continue?'))return}const s={id:uid('S'),ts:Date.now(),date:today(),fuel,l,price:p,amt,method:m,cid,note:f.note.value,staff:f.staff.value,cogs:0};S.sales.push(s);let r=l;for(const t of S.tanks.filter(t=>t.fuel===fuel)){const u=Math.min(t.stock,r);t.stock=r2(t.stock-u);s.cogs=r2(s.cogs+u*t.cost);r=r2(r-u);if(u)S.moves.push({id:uid('M'),tank:t.id,type:'sale',l:-u,date:today()})}
if(m==='credit')S.ledger.push({id:uid('L'),cid,type:'credit',amt,date:today(),note:'Fuel '+fuel+' '+l+' L ('+s.id+')',sale:s.id});log('Sale '+s.id+' '+fm(amt));await save();toast('Sale recorded');render()}
async function revSale(id){const s=S.sales.find(x=>x.id===id);if(!confirm('Reverse this sale? A reversal entry is kept in the audit trail.'))return;s.rev=true;const t=S.tanks.find(t=>t.fuel===s.fuel);if(t){t.stock=Math.min(t.cap,r2(t.stock+s.l));S.moves.push({id:uid('M'),tank:t.id,type:'reversal',l:s.l,date:today()})}if(s.method==='credit')S.ledger.push({id:uid('L'),cid:s.cid,type:'adj',amt:s.amt,date:today(),note:'Reversal of '+id});log('Reversed '+id);await save();render()}
function rcpt(id){const s=S.sales.find(x=>x.id===id),w={document:{write:h=>showRc(h),close(){}},print(){}};w.document.write(`<pre style="font:13px monospace">${esc(S.biz.name.toUpperCase())}\nOwner: ${esc(S.biz.owner)}\nPhone: ${esc(S.biz.phone)}\nLocation: ${esc(S.biz.loc)}\n------------------------\nReceipt: ${s.id}\nDate: ${s.date}\n${s.fuel} ${s.l} L x ${s.price}\nTotal: ${fm(s.amt)}\nPayment: ${s.method}\n${s.cid?'Customer: '+esc(S.customers.find(c=>c.id===s.cid)?.name)+'\nBalance: '+fm(bal(s.cid))+'\n':''}\nSignature: ________</pre>`);w.document.close();w.print()}
function wa(id){const c=S.customers.find(x=>x.id===id),m=prompt('Review or edit the message, then OK to open WhatsApp:',`Assalam o Alaikum ${c.name}, your outstanding balance at ${S.biz.name} is ${fm(bal(id))}. Please pay at your earliest convenience. Thank you.`);if(m)open('https://wa.me/'+c.phone+'?text='+encodeURIComponent(m))}
V.stock=()=>{$('#m').innerHTML=`<h1>Stock & Tanks</h1><form onsubmit="addTank(event)">${fld('Tank name','<input name="name" required>')}${fld('Fuel','<input name="fuel" list="fl" required><datalist id="fl"><option>Petrol<option>HSD</datalist>')}${fld('Capacity (L)','<input name="cap" type="number" min="1" required>')}${fld('Opening stock (L)','<input name="st" type="number" min="0" value="0">')}${fld('Min threshold (L)','<input name="min" type="number" min="0" value="0">')}${fld('Cost / L','<input name="cost" type="number" step="0.01" value="0">')}<button>+ Add tank</button></form>
${S.tanks.length?`<form onsubmit="mv(event)">${fld('Tank','<select name="t">'+S.tanks.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')+'</select>')}${fld('Action','<select name="a"><option value="purchase">Purchase (+)</option><option value="loss">Loss (−)</option><option value="measure">Set measured stock</option></select>')}${fld('Litres','<input name="l" type="number" step="0.01" min="0" required>')}${fld('Supplier','<select name="sid"><option value="">—</option>'+S.suppliers.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')+'</select>')}${fld('Invoice # (purchases)','<input name="inv">')}${fld('Cost / L','<input name="c" type="number" step="0.01">')}${fld('Amount paid','<input name="paid" type="number" step="0.01" value="0">')}<button>Save</button></form>`:''}
${tbl(['Tank','Fuel','Stock','Capacity','Used','Min','Cost/L'],S.tanks.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.fuel)}</td><td class="${t.stock<=t.min?'warn':''}">${t.stock.toFixed(2)}</td><td>${t.cap}</td><td style="min-width:90px"><div class="bar"><i style="width:${Math.min(100,t.stock/t.cap*100)}%"></i></div></td><td>${t.min}</td><td>${t.cost}</td></tr>`))}<h3>Movement history</h3>${tbl(['Date','Tank','Type','Litres','Invoice'],S.moves.slice().reverse().slice(0,40).map(m=>`<tr><td>${m.date}</td><td>${esc(S.tanks.find(t=>t.id===m.tank)?.name)}</td><td>${m.type}</td><td>${m.l}</td><td>${esc(m.inv||'')}</td></tr>`))}`};
async function addTank(e){e.preventDefault();const f=e.target,st=+f.st.value;if(st>+f.cap.value)return toast('Opening stock exceeds capacity');const t={id:uid('T'),name:f.name.value,fuel:f.fuel.value.trim(),cap:+f.cap.value,stock:st,min:+f.min.value,cost:+f.cost.value};S.tanks.push(t);if(!(t.fuel in S.prices))S.prices[t.fuel]=0;log('Tank '+t.name);await save();render()}
async function mv(e){e.preventDefault();const f=e.target,t=S.tanks.find(x=>x.id===f.t.value),l=+f.l.value,a=f.a.value;
if(a==='purchase'){const inv=f.inv.value.trim();if(inv&&S.moves.some(m=>m.inv===inv))return toast('Invoice already recorded');if(t.stock+l>t.cap)return toast('Exceeds tank capacity');const c=+f.c.value||t.cost;t.cost=Math.round(((t.stock*t.cost+l*c)/(t.stock+l||1))*100)/100;t.stock+=l;if((+f.paid.value||0)>l*c+0.005)return toast('Paid exceeds total');S.moves.push({id:uid('M'),tank:t.id,type:'purchase',l,inv,cost:c,paid:+f.paid.value||0,sid:f.sid.value,total:r2(l*c),date:today()})}
else if(a==='loss'){if(l>t.stock)return toast('Loss exceeds stock');t.stock-=l;S.moves.push({id:uid('M'),tank:t.id,type:'loss',l:-l,date:today()})}
else{if(l>t.cap)return toast('Exceeds capacity');S.moves.push({id:uid('M'),tank:t.id,type:'measured (was '+t.stock+')',l:l-t.stock,date:today()});t.stock=l}
log(a+' '+t.name);await save();render()}
V.exp=()=>{const cats=['Electricity','Staff salaries','Maintenance','Generator fuel','Cleaning','Water','Equipment','Repairs','Office','Bank charges','Other'];$('#m').innerHTML=`<h1>Expenses</h1><form onsubmit="addExp(event)">${fld('Date',`<input name="date" type="date" value="${today()}">`)}${fld('Category','<select name="cat">'+cats.map(c=>`<option>${c}</option>`).join('')+'</select>')}${fld('Description','<input name="d">')}${fld('Amount','<input name="amt" type="number" step="0.01" min="0.01" required>')}${fld('Method','<select name="method"><option value="cash">Cash</option><option value="bank">Bank</option></select>')}<button>Add expense</button></form><p><button class="g np" onclick="csv('expenses')">Export CSV</button></p>${tbl(['ID','Date','Category','Description','Amount','Method'],S.expenses.slice().reverse().map(x=>`<tr><td>${x.id}</td><td>${x.date}</td><td>${x.cat}</td><td>${esc(x.d)}</td><td>${fm(x.amt)}</td><td>${x.method}</td></tr>`))}`};
async function addExp(e){e.preventDefault();const f=e.target;S.expenses.push({id:uid('E'),date:f.date.value,cat:f.cat.value,d:f.d.value,amt:+f.amt.value,method:f.method.value});log('Expense '+fm(+f.amt.value));await save();render()}
V.cash=()=>{const d=today(),c=cashCalc(d);$('#m').innerHTML=`<h1>Cash Register — ${d}</h1><div class="grid"><div class="c"><div class="k">Opening cash</div><input type="number" value="${S.openCash}" onchange="S.openCash=+this.value;save();render()"></div>${[['Cash sales',c.cs],['Cash from customers',c.rc],['Cash expenses',-c.ex],['Supplier payments',-c.sp],['Expected closing',c.exp]].map(x=>`<div class="c"><div class="k">${x[0]}</div><div class="v">${fm(x[1])}</div></div>`).join('')}</div><div class="c"><label>Actual counted cash</label><input id="cnt" type="number" oninput="df.textContent=this.value===''?'':fm(this.value-${c.exp})" ><p>Difference (counted − expected): <b id="df"></b></p><button onclick="closeDay(${c.exp})">Save daily closing</button></div>${tbl(['Date','Expected','Counted','Difference'],S.closings.slice().reverse().slice(0,15).map(x=>`<tr><td>${x.date}</td><td>${fm(x.exp)}</td><td>${fm(x.cnt)}</td><td class="${x.diff?'warn':''}">${fm(x.diff)}</td></tr>`))}<p class="k">Credit sales are never counted as cash. Bank transfers are excluded.</p>`};
V.set=()=>{$('#m').innerHTML=`<h1>Settings & Backup</h1><form onsubmit="saveSet(event)">${fld('Business','<input name="n" value="'+esc(S.biz.name)+'">')}${fld('Owner','<input name="o" value="'+esc(S.biz.owner)+'">')}${fld('Phone','<input name="p" value="'+esc(S.biz.phone)+'">')}${fld('Location','<input name="l" value="'+esc(S.biz.loc)+'">')}${Object.keys(S.prices).map((k,i)=>fld(esc(k)+' price / L',`<input name="px${i}" type="number" step="0.01" value="${S.prices[k]}">`)).join('')}<button>Save settings</button></form>
<p><button class="g" onclick="backup()">Download JSON backup</button> <label style="display:inline">Restore: <input type="file" accept=".json" onchange="restore(this.files[0])" style="width:auto"></label> ${S.lastBackup?'<span class="k">Last backup: '+S.lastBackup+'</span>':''}</p><h3>Change password</h3><form onsubmit="chpw(event)">${fld('Current','<input name="o" type="password" required>')}${fld('New (8+ chars)','<input name="n" type="password" required>')}<button>Change</button></form><p class="k">Note: backup files contain your password hash. Keep them private.</p><h3>Fuel price history</h3>${tbl(['Time','Fuel','From','To'],S.phist.slice().reverse().slice(0,15).map(x=>`<tr><td>${x.date}</td><td>${esc(x.fuel)}</td><td>${x.from}</td><td>${x.to}</td></tr>`))}<h3>Audit trail</h3>${tbl(['Time','Action'],S.audit.slice(0,30).map(a=>`<tr><td>${a.t}</td><td>${esc(a.a)}</td></tr>`))}`};
async function saveSet(e){e.preventDefault();const f=e.target;S.biz={name:f.n.value,owner:f.o.value,phone:f.p.value,loc:f.l.value};Object.keys(S.prices).forEach((k,i)=>{const n=+f['px'+i].value||0;if(n!==S.prices[k])S.phist.push({date:nowS(),fuel:k,from:S.prices[k],to:n});S.prices[k]=n});log('Settings changed');await save();toast('Saved');render()}
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
async function backup(){S.lastBackup=nowS();log('Backup exported');await save();dl('mirza-backup-'+today()+'.json',JSON.stringify(S),'application/json');render()}
function restore(f){if(!f)return;const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);if(!d.customers||!d.ledger||!d.sales||!d.tanks||!d.biz)throw 0;if(!confirm('This REPLACES all current records with the backup. Continue?'))return;S=d;log('Backup restored');await save();toast('Restored');render()}catch(e){toast('Invalid backup file')}};r.readAsText(f)}
function csv(k){const a=S[k];if(!a.length)return toast('Nothing to export');const h=Object.keys(a[0]);dl(k+'.csv',[h.join(',')].concat(a.map(r=>h.map(c=>'"'+String(r[c]??'').replace(/"/g,'""')+'"').join(','))).join('\n'),'text/csv')}
let idle=Date.now(),lastRep=[],rf=today().slice(0,8)+'01',rt=today();const r2=n=>Math.round((+n||0)*100)/100;
const openFor=d=>{const p=S.closings.filter(x=>x.date<d).sort((a,b)=>a.date<b.date?-1:1).pop();return p?p.cnt:S.openCash};
function theme(){const d=document.documentElement,n=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=n;try{localStorage.setItem('th',n)}catch(e){}}
function showRc(h){document.body.classList.add('rp');let d=document.getElementById('rc');if(!d){d=document.createElement('div');d.id='rc';document.body.appendChild(d)}d.innerHTML='<div class="p">'+h+'<p class="b"><button onclick="print()">Print / Save PDF</button> <button class="g" onclick="document.getElementById(\'rc\').remove();document.body.classList.remove(\'rp\')">Close</button></p></div>'}
async function chpw(e){e.preventDefault();const f=e.target;if(await hash(f.o.value,S.owner.salt)!==S.owner.h)return toast('Current password is wrong');if(f.n.value.length<8)return toast('Minimum 8 characters');const salt=uid('S');S.owner={salt,h:await hash(f.n.value,salt)};log('Password changed');await save();toast('Password changed');f.reset()}
async function closeDay(exp){const v=$('#cnt').value;if(v==='')return toast('Enter counted cash first');const d=today();if(S.closings.some(x=>x.date===d)&&!confirm('A closing is already saved today. Add another?'))return;const diff=r2(v-exp);S.closings.push({date:d,exp:r2(exp),cnt:+v,diff});if(diff)log('Cash '+(diff<0?'shortage ':'excess ')+fm(Math.abs(diff)));await save();toast(diff?(diff<0?'Shortage ':'Excess ')+fm(Math.abs(diff)):'Cash matches');render()}
function bars(n){const days=[...Array(n)].map((_,i)=>new Date(Date.now()-(n-1-i)*864e5).toLocaleDateString('en-CA',{timeZone:'Asia/Karachi'}));const v=days.map(d=>S.sales.filter(x=>x.date===d&&!x.rev).reduce((a,x)=>a+x.amt,0)),m=Math.max(...v,1);return `<svg viewBox="0 0 ${n*50} 110" style="width:100%;max-height:150px">${v.map((x,i)=>`<rect x="${i*50+6}" y="${90-x/m*80}" width="38" height="${x/m*80}" fill="#d62828" rx="3"/><text x="${i*50+25}" y="104" font-size="9" text-anchor="middle" fill="currentColor">${days[i].slice(5)}</text>`).join('')}</svg>`}
V.rep=()=>{const D=[];for(let d=new Date(rf+'T00:00:00Z');d<=new Date(rt+'T00:00:00Z')&&D.length<400;d=new Date(+d+864e5))D.push(d.toISOString().slice(0,10));
const rows=D.map(d=>{const s=S.sales.filter(x=>x.date===d&&!x.rev),rev=s.reduce((a,x)=>a+x.amt,0),cr=s.filter(x=>x.method==='credit').reduce((a,x)=>a+x.amt,0),cg=s.reduce((a,x)=>a+(x.cogs||0),0),ex=S.expenses.filter(x=>x.date===d).reduce((a,x)=>a+x.amt,0);return{d,l:s.reduce((a,x)=>a+x.l,0),rev,cr,cg,gp:rev-cg,ex,op:rev-cg-ex}}).filter(r=>r.rev||r.ex);lastRep=rows;
const T=k=>rows.reduce((a,r)=>a+r[k],0),fw={};S.sales.filter(x=>x.date>=rf&&x.date<=rt&&!x.rev).forEach(x=>{fw[x.fuel]=fw[x.fuel]||{l:0,a:0};fw[x.fuel].l+=x.l;fw[x.fuel].a+=x.amt});
$('#m').innerHTML=`<h1>Reports & P&L</h1><form class="np"><div><label>From</label><input type="date" value="${rf}" onchange="rf=this.value;V.rep()"></div><div><label>To</label><input type="date" value="${rt}" onchange="rt=this.value;V.rep()"></div><button type="button" onclick="print()">Print</button><button type="button" class="g" onclick="repCsv()">CSV</button></form><div class="grid">${[['Revenue',T('rev')],['Credit sales',T('cr')],['Cost of fuel sold',T('cg')],['Gross profit',T('gp')],['Expenses',T('ex')],['Operating profit',T('op')]].map(x=>`<div class="c"><div class="k">${x[0]}</div><div class="v">${fm(x[1])}</div></div>`).join('')}</div>${tbl(['Date','Litres','Revenue','Credit','COGS','Gross','Expenses','Operating'],rows.map(r=>`<tr><td>${r.d}</td><td>${r.l.toFixed(2)}</td><td>${fm(r.rev)}</td><td>${fm(r.cr)}</td><td>${fm(r.cg)}</td><td>${fm(r.gp)}</td><td>${fm(r.ex)}</td><td class="${r.op<0?'warn':''}">${fm(r.op)}</td></tr>`))}<h3>Fuel-wise</h3>${tbl(['Fuel','Litres','Revenue'],Object.keys(fw).map(k=>`<tr><td>${esc(k)}</td><td>${fw[k].l.toFixed(2)}</td><td>${fm(fw[k].a)}</td></tr>`))}<p class="k">Profit is estimated using the weighted-average cost recorded at sale time. Taxes, losses and valuation adjustments can change final accounting profit.</p>`};
function repCsv(){if(!lastRep.length)return toast('Nothing to export');const h=Object.keys(lastRep[0]);dl('report-'+rf+'_'+rt+'.csv',[h.join(',')].concat(lastRep.map(r=>h.map(c=>r[c]).join(','))).join('\n'),'text/csv')}
const pay=id=>r2(S.moves.filter(m=>m.sid===id&&m.type==='purchase').reduce((a,m)=>a+(m.total||0)-(m.paid||0),0)-S.spay.filter(x=>x.sid===id).reduce((a,x)=>a+x.amt,0));
V.sup=()=>{$('#m').innerHTML=`<h1>Suppliers</h1><form onsubmit="addSup(event)">${fld('Name','<input name="n" required>')}${fld('Phone','<input name="p">')}${fld('Opening payable','<input name="o" type="number" step="0.01" value="0">')}<button>+ Add supplier</button></form>${S.suppliers.length?`<form onsubmit="paySup(event)">${fld('Supplier','<select name="s">'+S.suppliers.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')+'</select>')}${fld('Amount','<input name="a" type="number" step="0.01" min="0.01" required>')}${fld('Method','<select name="m"><option value="cash">Cash</option><option value="bank">Bank</option></select>')}<button>Pay supplier</button></form>`:''}${tbl(['ID','Name','Phone','Payable'],S.suppliers.map(s=>`<tr><td>${s.id}</td><td>${esc(s.name)}</td><td>${esc(s.phone)}</td><td class="${pay(s.id)>0?'warn':''}">${fm(pay(s.id)+(s.open||0))}</td></tr>`))}<h3>Purchases</h3>${tbl(['Date','Supplier','Invoice','Litres','Total','Paid'],S.moves.filter(m=>m.type==='purchase').reverse().slice(0,30).map(m=>`<tr><td>${m.date}</td><td>${esc(S.suppliers.find(s=>s.id===m.sid)?.name||'')}</td><td>${esc(m.inv)}</td><td>${m.l}</td><td>${fm(m.total)}</td><td>${fm(m.paid)}</td></tr>`))}`};
async function addSup(e){e.preventDefault();const f=e.target;S.suppliers.push({id:uid('SP'),name:f.n.value.trim(),phone:f.p.value,open:+f.o.value||0});log('Supplier '+f.n.value);await save();render()}
async function paySup(e){e.preventDefault();const f=e.target,s=S.suppliers.find(x=>x.id===f.s.value),a=+f.a.value;if(a>pay(s.id)+(s.open||0)+0.005&&!confirm('Payment exceeds payable. Continue?'))return;if(s.open&&a>pay(s.id)){}S.spay.push({id:uid('SPY'),sid:s.id,amt:a,method:f.m.value,date:today()});log('Paid supplier '+fm(a));await save();toast('Payment saved');render()}
const migrate=()=>{S.suppliers=S.suppliers||[];S.spay=S.spay||[];S.closings=S.closings||[];S.phist=S.phist||[];S.staff=S.staff||[];S.att=S.att||[]};
V.staff=()=>{const d=today();$('#m').innerHTML=`<h1>Staff</h1><form onsubmit="addStaff(event)">${fld('Name','<input name="n" required>')}${fld('Phone','<input name="p">')}${fld('Role','<input name="r" value="Pump attendant">')}${fld('Salary / month','<input name="s" type="number" min="0" value="0">')}${fld('Joining date',`<input name="j" type="date" value="${d}">`)}<button>+ Add staff</button></form>${tbl(['ID','Name','Role','Salary','Status','Today','Sales (total)','Paid this month',''],S.staff.map(s=>{const a=S.att.find(x=>x.sid===s.id&&x.date===d),sl=S.sales.filter(x=>x.staff===s.id&&!x.rev).reduce((t,x)=>t+x.amt,0),pd=S.expenses.filter(x=>x.sid===s.id&&x.date.slice(0,7)===d.slice(0,7)).reduce((t,x)=>t+x.amt,0);return`<tr><td>${s.id}</td><td>${esc(s.name)}</td><td>${esc(s.role)}</td><td>${fm(s.salary)}</td><td>${s.active===false?'Left':'Active'}</td><td><select onchange="mark('${s.id}',this.value)"><option value="">—</option>${['Present','Absent','Leave'].map(o=>`<option ${a&&a.st===o?'selected':''}>${o}</option>`).join('')}</select></td><td>${fm(sl)}</td><td>${fm(pd)}</td><td><button class="s" onclick="paySal('${s.id}')">Pay salary</button> <button class="s g" onclick="togStaff('${s.id}')">${s.active===false?'Reactivate':'Mark left'}</button></td></tr>`}))}<h3>Attendance (recent)</h3>${tbl(['Date','Staff','Status'],S.att.slice().reverse().slice(0,30).map(x=>`<tr><td>${x.date}</td><td>${esc((S.staff.find(s=>s.id===x.sid)||{}).name)}</td><td>${x.st}</td></tr>`))}<p class="k">Salary payments are saved as expenses (cash) so the cash register stays correct.</p>`};
async function addStaff(e){e.preventDefault();const f=e.target;S.staff.push({id:uid('ST'),name:f.n.value.trim(),phone:f.p.value,role:f.r.value,salary:+f.s.value||0,join:f.j.value});log('Staff added '+f.n.value);await save();render()}
async function mark(id,v){S.att=S.att.filter(x=>!(x.sid===id&&x.date===today()));if(v)S.att.push({sid:id,date:today(),st:v});log('Attendance '+id+' '+v);await save()}
async function togStaff(id){const s=S.staff.find(x=>x.id===id);s.active=s.active===false;log('Staff status '+id);await save();render()}
async function paySal(id){const s=S.staff.find(x=>x.id===id),a=+prompt('Salary amount (Rs) for '+s.name,s.salary);if(!(a>0))return;S.expenses.push({id:uid('E'),date:today(),cat:'Staff salaries',d:'Salary: '+s.name,amt:a,method:'cash',sid:id});log('Salary '+fm(a)+' '+id);await save();toast('Salary recorded');render()}

const CFG={url:'',key:''};let sb=null,sbT=null,sbUid=null;
function loadSb(){return new Promise(r=>{if(!CFG.url||!CFG.key)return r(false);const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';s.onload=()=>{sb=supabase.createClient(CFG.url,CFG.key);r(true)};s.onerror=()=>{toast('Could not load Supabase');r(false)};document.head.appendChild(s)})}
const _lv=loginView;loginView=function(){_lv();if(!sb)return;const l=$('#login');l.querySelector('p.k').textContent='Sign in with your owner account (email + password). Data is stored in your Supabase database.';const i=document.createElement('input');i.id='em';i.type='email';i.placeholder='Email';i.autocomplete='username';l.querySelector('label').before(i)};
const _dl=doLogin;doLogin=async function(){if(!sb)return _dl();const a=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(a.error)return toast('Login failed: '+a.error.message);sbUid=a.data.user.id;const r=await sb.from('app_state').select('data').eq('user_id',sbUid).maybeSingle();if(r.error)return toast('Load failed: '+r.error.message);if(r.data){if((S.customers.length||S.sales.length)&&!confirm('Cloud data will replace the data stored in this browser. Continue?'))return;S=r.data.data;migrate()}session=true;log('Cloud login');await save();render()};
const _sv=save;save=async function(){await _sv();if(sb&&session&&sbUid){clearTimeout(sbT);sbT=setTimeout(async()=>{const e=(await sb.from('app_state').upsert({user_id:sbUid,data:JSON.parse(JSON.stringify(S)),updated_at:new Date().toISOString()})).error;if(e)toast('Cloud sync failed: '+e.message)},800)}};
loadSb().then(boot);
